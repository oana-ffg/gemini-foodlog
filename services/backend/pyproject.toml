[project]
name = "gemini-foodlog-backend"
version = "0.1.0"
description = "Gemini FoodLog ingestion API and agent worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "firebase-admin>=7.5,<8",
  "google-adk[gcp]>=2,<3",
  # 2.35.0 percent-encodes Firestore's (default) database ID in gRPC resource names.
  "google-api-core[grpc]>=2.34,<2.35",
  "google-cloud-firestore>=2.28,<3",
  "google-cloud-storage>=3.13,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodlog_backend", "src/foodlog_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
