[project]
name = "gemini-foodlog-camera-client"
version = "0.1.0"
description = "Python fixture and webcam client for the Gemini FoodLog capture API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.28,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
webcam = [
  "opencv-python>=4.12,<5",
]

[project.scripts]
foodlog-camera = "foodlog_camera.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodlog_camera"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
